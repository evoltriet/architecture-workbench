name: Release 0.2.0

on:
  push:
    tags:
      - v0.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          pnpm check
          pnpm example:diagrams
          pnpm example:validate
          pnpm example:build
          pnpm pack:verify

      - name: Create package and checksum
        run: |
          mkdir -p outputs/release
          pnpm pack --pack-destination outputs/release
          cd outputs/release
          sha256sum *.tgz > architecture-workbench-${GITHUB_REF_NAME}.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            outputs/release/*.tgz \
            outputs/release/*.sha256 \
            examples/service-fulfillment/dist/civic-service-fulfillment.docx \
            --verify-tag \
            --title "Architecture Workbench $GITHUB_REF_NAME" \
            --notes-file docs/releases/0.2.0.md
